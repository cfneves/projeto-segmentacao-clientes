name: CI — Verificação de Código

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    name: Lint e Importações

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar importações dos módulos src/
        run: |
          python -c "from src.preprocessing import load_default_data, get_numeric_columns, prepare_features; print('✅ preprocessing OK')"
          python -c "from src.train import compute_elbow, train_kmeans; print('✅ train OK')"
          python -c "from src.evaluation import evaluate_clustering, silhouette_label, davies_bouldin_label, calinski_harabasz_label; print('✅ evaluation OK')"
          python -c "from src.pipeline import CustomerSegmentationPipeline, PipelineConfig, PipelineResults; print('✅ pipeline OK')"
          python -c "from src.utils import assign_personas, PERSONA_COLORS, PERSONA_ACTIONS; print('✅ utils OK')"

      - name: Testar pipeline com dataset de exemplo
        run: |
          python -c "
          import pandas as pd
          from src.pipeline import CustomerSegmentationPipeline, PipelineConfig

          df = pd.read_csv('data/sample_customers.csv')
          pipeline = CustomerSegmentationPipeline(PipelineConfig(k=5))
          results = pipeline.run(df, feature_cols=['Annual Income (k\$)', 'Spending Score (1-100)'])

          assert results.k == 5
          assert results.metrics['silhouette'] is not None
          assert len(results.df_clustered) == len(df)
          print(f'✅ Pipeline OK — Silhouette: {results.metrics[\"silhouette\"]:.3f}')
          "
